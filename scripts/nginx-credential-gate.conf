# Drop-in nginx block for the /api/credential-gate/* prefix.
#
# Today's nginx configs list each /api/<route> explicitly (no catch-all),
# so /api/credential-gate/liveness falls through to try_files and returns
# the SPA index.html instead of the JSON the homepage card expects.
#
# Add the block below to ALL FOUR domain configs — the route is implemented
# only on the mainnet API server (port 3005) and hits the preview indexer
# regardless of which domain the visitor is on, so all four configs proxy
# to 127.0.0.1:3005.
#
# Targets:
#   /etc/nginx/sites-enabled/nightforge.jp           (apex)
#   /etc/nginx/sites-enabled/mainnet.nightforge.jp
#   /etc/nginx/sites-enabled/preview.nightforge.jp
#   /etc/nginx/sites-enabled/preprod.nightforge.jp
#
# Place the block alongside the other "location /api/<route>" lines in each
# server { } block (the existing /api/dust-status, /api/stats etc).

location /api/credential-gate/ {
    proxy_pass http://127.0.0.1:3005/api/credential-gate/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Apply + verify (run as root):
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verify after reload:
#   curl -sI https://mainnet.nightforge.jp/api/credential-gate/liveness | grep -i content-type
#   curl -sI https://nightforge.jp/api/credential-gate/liveness          | grep -i content-type
#   curl -sI https://preview.nightforge.jp/api/credential-gate/liveness  | grep -i content-type
#   curl -sI https://preprod.nightforge.jp/api/credential-gate/liveness  | grep -i content-type
# All four should return: content-type: application/json
